<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Meme educativo sobre ciclos while</title>
  <desc id="desc">Una tarjeta humorística sobre un ciclo while cuya condición nunca cambia.</desc>
  <rect width="900" height="260" rx="24" fill="#f7f7f7"/>
  <rect x="18" y="18" width="864" height="224" rx="18" fill="white" stroke="#222" stroke-width="3"/>
  <text x="450" y="75" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#111">while condición:</text>
  <text x="450" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#333">“¿por qué no termina?”</text>
  <text x="450" y="190" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#111">La condición: nunca cambia.</text>
</svg>